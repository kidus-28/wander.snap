<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login – Wander Snap</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@300;400;500;600&family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        body { display:flex; align-items:center; justify-content:center; min-height:100vh; }
        .login-card { background:rgba(30,41,59,0.45); backdrop-filter:blur(20px); border:1px solid rgba(96,165,250,0.18); border-radius:28px; padding:4rem; width:100%; max-width:480px; box-shadow:0 20px 60px rgba(0,0,0,0.5); text-align:center; }
        h1 { font-family:'Dancing Script',cursive; font-size:4.5rem; color:#60a5fa; margin-bottom:2rem; }
        input { width:100%; padding:16px; margin:1rem 0; border-radius:12px; border:1px solid #60a5fa; background:rgba(255,255,255,0.08); color:white; font-size:1.1rem; }
        button { width:100%; padding:16px; background:linear-gradient(90deg,#3b82f6,#60a5fa); color:white; border:none; border-radius:16px; font-size:1.2rem; cursor:pointer; margin-top:1.5rem; }
        .error { color:#ef4444; margin-top:1rem; }
    </style>
</head>
<body>

<nav style="position:fixed; top:0; left:0; right:0; background:rgba(15,23,42,0.95); backdrop-filter:blur(12px); padding:1.2rem 5%; display:flex; justify-content:space-between; align-items:center; z-index:1000;">

    <!-- Logo -->
    <div style="font-family:'Dancing Script', cursive; font-size:2.85rem; color:#60a5fa; font-weight:700;">
        Wander Snap
    </div>

    <!-- Main Links -->
    <div style="display:flex; gap:2.5rem; font-size:1.05rem; font-weight:500;">
        <a href="index.html" style="color:#cbd5e1; text-decoration:none;">Home</a>
        <a href="destinations.html" style="color:#cbd5e1; text-decoration:none;">Explore</a>
        <a href="gallery.html" style="color:#cbd5e1; text-decoration:none;">Gallery</a>
        <a href="about.html" style="color:#cbd5e1; text-decoration:none;">About</a>
        <a href="contact.html" style="color:#cbd5e1; text-decoration:none;">Contact</a>
        
        <!-- Profile with Dropdown -->
        <div class="profile-menu" style="position:relative;">
            <a href="#" onclick="toggleDropdown(event)" style="color:#60a5fa; text-decoration:none; font-weight:600; display:flex; align-items:center; gap:6px;">
                Profile ▼
            </a>
            
            <!-- Dropdown Menu -->
            <div id="dropdown" style="display:none; position:absolute; top:100%; right:0; background:rgba(30,41,59,0.95); backdrop-filter:blur(12px); border-radius:12px; min-width:180px; box-shadow:0 10px 30px rgba(0,0,0,0.5); padding:12px 0; z-index:2000;">
                <a href="profile.html" style="display:block; padding:12px 20px; color:#cbd5e1; text-decoration:none;">My Profile</a>
                <a href="setting.html" style="display:block; padding:12px 20px; color:#cbd5e1; text-decoration:none;">Settings</a>
                <a href="login.html" style="display:block; padding:12px 20px; color:#cbd5e1; text-decoration:none;">Login</a>
                <a href="admin-dashboard.html" style="display:block; padding:12px 20px; color:#cbd5e1; text-decoration:none;">Admin</a>
            </div>
        </div>
    </div>
</nav>

<div class="login-card">
    <h1>Wander Snap</h1>
    <form id="login-form">
        <input type="text" id="username" placeholder="Username (admin)" required>
        <input type="password" id="password" placeholder="Password (snap123)" required>
        <button type="submit">Login</button>
        <div id="error-msg" class="error"></div>
    </form>
</div>

<script>
document.getElementById('login-form').addEventListener('submit', e => {
    e.preventDefault();
    const user = document.getElementById('username').value.trim();
    const pass = document.getElementById('password').value.trim();
    const error = document.getElementById('error-msg');

    if (user === 'admin' && pass === 'snap123') {
        localStorage.setItem('isAdmin', 'true');
        window.location.href = 'admin-dashboard.html';
    } else {
        error.textContent = 'Wrong username or password';
    }
});
</script>

<script>
function toggleDropdown(e) {
    e.preventDefault();
    const dropdown = document.getElementById('dropdown');
    dropdown.style.display = dropdown.style.display === 'block' ? 'none' : 'block';
}

// Close dropdown when clicking anywhere else
document.addEventListener('click', function(e) {
    const dropdown = document.getElementById('dropdown');
    if (!e.target.closest('.profile-menu')) {
        dropdown.style.display = 'none';
    }
});
</script>

</body>
</html>
