<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>50 Dream Destinations – WanderWorld</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@300;400;500;600&family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { 
            font-family:'Inter',sans-serif; 
            background:#0f172a; 
            color:#e2e8f0; 
            line-height:1.6;
        }
        nav {
            position:fixed; top:0; left:0; right:0;
            background:rgba(15,23,42,0.8);
            backdrop-filter:blur(12px);
            padding:1.2rem 5%;
            display:flex;
            justify-content:space-between;
            align-items:center;
            z-index:1000;
            border-bottom:1px solid rgba(255,255,255,0.08);
        }
        .logo { 
            font-family:'Playfair Display',serif; 
            font-size:1.9rem; 
            color:#60a5fa; 
            font-weight:700; 
        }
        .nav-links a { 
            color:#cbd5e1; 
            text-decoration:none; 
            margin-left:2.2rem; 
            font-weight:500; 
            transition:color 0.3s; 
        }
        .nav-links a:hover, .nav-links a.active { color:#60a5fa; }

        .hero {
            height:100vh;
            background:url('https://images.unsplash.com/photo-1506905925346-21bda4d32df4?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80') center/cover no-repeat fixed;
            position:relative;
            display:flex;
            align-items:center;
            justify-content:center;
            text-align:center;
        }
        .hero::before {
            content:''; 
            position:absolute; 
            inset:0; 
            background:linear-gradient(to bottom, rgba(15,23,42,0.65), rgba(30,41,59,0.85));
        }
        .hero-content {
            position:relative; 
            z-index:2; 
            max-width:900px; 
            padding:0 5%;
        }
        .hero h1 {
            font-family:'Playfair Display',serif;
            font-size:5.2rem;
            line-height:1.05;
            margin-bottom:1rem;
            color:white;
            text-shadow:0 8px 32px rgba(0,0,0,0.7);
        }
        .hero p {
            font-size:1.55rem;
            font-weight:300;
            opacity:0.95;
        }

        section { padding:120px 5% 80px; max-width:1300px; margin:0 auto; }
        .destinations-grid {
            display:grid;
            grid-template-columns:repeat(auto-fit, minmax(360px, 1fr));
            gap:2.5rem;
        }
        .destination-card {
            background:rgba(30,41,59,0.45);
            backdrop-filter:blur(20px);
            border:1px solid rgba(96,165,250,0.18);
            border-radius:28px;
            overflow:hidden;
            transition:all 0.4s ease;
            box-shadow:0 10px 30px rgba(0,0,0,0.4);
        }
        .destination-card:hover {
            transform:translateY(-15px);
            box-shadow:0 30px 80px rgba(96,165,250,0.25);
        }
        .destination-card img {
            width:100%;
            height:260px;
            object-fit:cover;
        }
        .destination-card h2 {
            font-family:'Playfair Display',serif;
            font-size:2.1rem;
            color:#e0f2fe;
            padding:1.8rem 1.8rem 0.8rem;
            margin:0;
        }
        .destination-card p {
            padding:0 1.8rem 2rem;
            color:#cbd5e1;
            font-size:1.05rem;
            line-height:1.65;
        }

        footer {
            background:rgba(15,23,42,0.9);
            padding:4rem 5% 2rem;
            text-align:center;
            border-top:1px solid rgba(96,165,250,0.1);
        }
        footer p { color:#94a3b8; font-size:0.95rem; }
    </style>
</head>
<body>

<nav>
    <div class="logo">Wander Snap</div>
