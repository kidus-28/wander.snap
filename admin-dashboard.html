<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard – Wander Snap</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@300;400;500;600&family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .dashboard { max-width:1200px; margin:100px auto; padding:0 5%; }
        .card { background:rgba(30,41,59,0.45); backdrop-filter:blur(20px); border-radius:20px; padding:2.5rem; margin-bottom:2rem; border:1px solid rgba(96,165,250,0.18); }
        h1 { font-family:'Dancing Script',cursive; font-size:5rem; color:#60a5fa; text-align:center; margin-bottom:2rem; }
        table { width:100%; border-collapse:collapse; margin-top:1.5rem; }
        th, td { padding:14px; text-align:left; border-bottom:1px solid rgba(96,165,250,0.15); }
        th { background:rgba(96,165,250,0.1); color:#e0f2fe; }
    </style>
</head>
<body>

<nav style="position:fixed; top:0; left:0; right:0; background:rgba(15,23,42,0.95); backdrop-filter:blur(12px); padding:1.2rem 5%; display:flex; justify-content:space-between; align-items:center; z-index:1000;">

    <!-- Logo -->
    <div style="font-family:'Dancing Script', cursive; font-size:2.85rem; color:#60a5fa; font-weight:700;">
        Wander Snap
    </div>

    <!-- Main Links -->
    <div style="display:flex; gap:2.5rem; font-size:1.05rem; font-weight:500;">
        <a href="index.html" style="color:#cbd5e1; text-decoration:none;">Home</a>
        <a href="destinations.html" style="color:#cbd5e1; text-decoration:none;">Explore</a>
        <a href="gallery.html" style="color:#cbd5e1; text-decoration:none;">Gallery</a>
        <a href="about.html" style="color:#cbd5e1; text-decoration:none;">About</a>
        <a href="contact.html" style="color:#cbd5e1; text-decoration:none;">Contact</a>
        
        <!-- Profile with Dropdown -->
        <div class="profile-menu" style="position:relative;">
            <a href="#" onclick="toggleDropdown(event)" style="color:#60a5fa; text-decoration:none; font-weight:600; display:flex; align-items:center; gap:6px;">
                Profile ▼
            </a>
            
            <!-- Dropdown Menu -->
            <div id="dropdown" style="display:none; position:absolute; top:100%; right:0; background:rgba(30,41,59,0.95); backdrop-filter:blur(12px); border-radius:12px; min-width:180px; box-shadow:0 10px 30px rgba(0,0,0,0.5); padding:12px 0; z-index:2000;">
                <a href="profile.html" style="display:block; padding:12px 20px; color:#cbd5e1; text-decoration:none;">My Profile</a>
                <a href="setting.html" style="display:block; padding:12px 20px; color:#cbd5e1; text-decoration:none;">Settings</a>
                <a href="login.html" style="display:block; padding:12px 20px; color:#cbd5e1; text-decoration:none;">Login</a>
                <a href="admin-dashboard.html" style="display:block; padding:12px 20px; color:#cbd5e1; text-decoration:none;">Admin</a>
            </div>
        </div>
    </div>
</nav>

<div class="dashboard">
    <h1>Admin Dashboard</h1>

    <div class="card">
        <h2>Contact Messages</h2>
        <table id="messages-table">
            <thead>
                <tr><th>Name</th><th>Email</th><th>Message</th><th>Date</th></tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <div class="card">
        <h2>Quick Stats</h2>
        <p>Contact submissions: <span id="msg-count">0</span></p>
    </div>
</div>

<script>
if (localStorage.getItem('isAdmin') !== 'true') {
    window.location.href = 'login.html';
}

const messages = JSON.parse(localStorage.getItem('contactMessages')) || [];
const tbody = document.querySelector('#messages-table tbody');
const count = document.getElementById('msg-count');

messages.forEach(msg => {
    tbody.innerHTML += `
        <tr>
            <td>${msg.name}</td>
            <td>${msg.email}</td>
            <td>${msg.message.substring(0, 100)}${msg.message.length > 100 ? '...' : ''}</td>
            <td>${new Date(msg.date).toLocaleString()}</td>
        </tr>`;
});
count.textContent = messages.length;
</script>

<script>
function toggleDropdown(e) {
    e.preventDefault();
    const dropdown = document.getElementById('dropdown');
    dropdown.style.display = dropdown.style.display === 'block' ? 'none' : 'block';
}

// Close dropdown when clicking anywhere else
document.addEventListener('click', function(e) {
    const dropdown = document.getElementById('dropdown');
    if (!e.target.closest('.profile-menu')) {
        dropdown.style.display = 'none';
    }
});
</script>

</body>
</html>
